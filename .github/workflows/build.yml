name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -o pipefail
          (
            set -ex
            unzip -o "$(ls -t *.zip | head -1)"
            cd VencordAndroid
            chmod +x gradlew
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            ./gradlew assembleDebug --stacktrace
          ) 2>&1 | tee build.log
      - name: Show error
        if: failure()
        run: |
          echo '### Build log (last 60 lines)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Vencord-APK
          path: VencordAndroid/app/build/outputs/apk/debug/app-debug.apk
